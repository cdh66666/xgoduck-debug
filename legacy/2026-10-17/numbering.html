<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XGO Duck 自动编号</title><link rel="stylesheet" href="/assets/commissioning.css"><link rel="stylesheet" href="/assets/duck-dark.css?v=1">
<style>
body.numbering-page{margin:0;background:var(--duck-bg,#171d25);color:var(--duck-text,#edf2f7);font:15px/1.55 "Microsoft YaHei",system-ui,sans-serif}.numbering-page main{max-width:640px;margin:auto;padding:18px 22px}.numbering-page h1{margin:0 0 14px;font-size:22px;font-weight:600}.numbering-page p{margin:10px 0}.numbering-page .condition{padding:11px 14px;border-left:3px solid var(--duck-accent,#ffc451);background:var(--duck-panel,#232d3a);font-size:13px}.numbering-page .connection{width:100%;height:110px;display:block}.connection rect,.connection circle{fill:var(--duck-panel,#232d3a);stroke:var(--duck-line,#3a485a);stroke-width:2}.connection path{fill:none;stroke:var(--duck-accent,#ffc451);stroke-width:2}.connection text{fill:var(--duck-muted,#a4b0bf);font:13px "Microsoft YaHei",sans-serif}.numbering-page label{display:block;margin:12px 0 0;font-size:12px;color:var(--duck-muted,#a4b0bf)}.numbering-page select{display:block;width:100%;min-height:44px;padding:9px 12px;margin-top:5px;background:var(--duck-panel,#232d3a);color:var(--duck-text,#edf2f7);border:1px solid var(--duck-line,#3a485a);border-radius:7px;font:inherit}.numbering-page .readback{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0;color:var(--duck-muted,#a4b0bf);font-size:13px}.readback strong{font-size:29px;color:var(--duck-text,#edf2f7);font-weight:500;line-height:1.2;margin-left:8px;font-variant-numeric:tabular-nums}.readback b{font-size:15px;font-weight:500;margin-left:7px;font-variant-numeric:tabular-nums}.numbering-page #start{display:block;width:100%;min-height:48px;padding:11px 18px;margin:0 0 20px;border:1px solid var(--duck-accent,#ffc451);border-radius:7px;background:var(--duck-accent,#ffc451);color:#1d2630;font:600 15px "Microsoft YaHei",sans-serif;cursor:pointer}.numbering-page #start[data-action=stop]{background:#713d3b;border-color:#a86862;color:#ffd4ce}.numbering-page #start:disabled{opacity:.43;cursor:not-allowed}.numbering-page :is(button,select):focus-visible{outline:2px solid var(--duck-accent,#ffc451);outline-offset:3px}.phase-track{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.phase-track li{position:relative;text-align:center;color:var(--duck-muted,#a4b0bf);padding-top:26px;font-size:12px}.phase-track li::before{content:"";position:absolute;top:4px;left:calc(50% - 7px);width:14px;height:14px;border:2px solid var(--duck-line,#3a485a);border-radius:50%;background:var(--duck-bg,#171d25)}.phase-track li[data-state=active]{color:var(--duck-accent,#ffc451)}.phase-track li[data-state=active]::before{border-color:var(--duck-accent,#ffc451)}.phase-track li[data-state=done]{color:var(--duck-good,#77c8a3)}.phase-track li[data-state=done]::before{background:var(--duck-good,#77c8a3);border-color:var(--duck-good,#77c8a3)}.phase-track li[data-state=error]{color:#f3aba2}.phase-track li[data-state=error]::before{border-color:#f3aba2}.numbering-page #status{min-height:24px;margin-top:18px;font-size:13px;overflow-wrap:anywhere}.numbering-page #feedback,.numbering-page .note{font-size:11px;color:var(--duck-muted,#a4b0bf)}.numbering-page .note{margin:14px 0 0}@media(max-width:420px){.numbering-page main{padding:14px}.numbering-page h1{font-size:20px}.numbering-page .condition{font-size:12px}.connection{height:95px!important}}
</style></head><body class="numbering-page duck-dark"><main>
<h1>顺序自动编号</h1>
<p class="condition">已编号的保留，每次只新增一颗 ID 1 裸舵机。</p>
<svg class="connection" viewBox="0 0 520 100" role="img" aria-label="USB转接板保留已编号舵机，每次只新增一颗出厂ID1"><rect x="25" y="25" width="125" height="50" rx="6"/><text x="87" y="55" text-anchor="middle">USB / B 转接板</text><path d="M150 50H185M315 50H350"/><rect x="185" y="25" width="130" height="50" rx="6"/><text x="250" y="55" text-anchor="middle">已编号 · 保留</text><rect x="350" y="18" width="145" height="64" rx="6"/><text x="422" y="55" text-anchor="middle">新增 1 颗 ID 1</text></svg>
<label>串口<select id="port" aria-label="串口"></select></label>
<div class="readback"><span><span id="target-label">下一颗 ID</span><strong id="target-id">10</strong></span><span>已编号<b id="completed-count">0 / 15</b></span></div>
<button id="start" type="button" disabled>自动编号</button>
<ol class="phase-track" aria-label="实际编号进度"><li id="phase-connect" data-state="pending">连接</li><li id="phase-numbering" data-state="pending">改号</li><li id="phase-centering" data-state="pending">归中</li><li id="phase-release" data-state="pending">卸力</li></ol>
<p id="status" role="status" aria-live="polite">尚未开始。</p><div id="feedback"></div>
<p class="note">新增舵机会转到 2047，舵盘留空。完成后贴号，断电加下一颗。</p>
</main><script>window.NUMBERING_TOKEN='__TOKEN__';</script><script src="/assets/numbering.js?v=3"></script></body></html>
