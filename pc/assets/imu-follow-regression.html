<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>IMU 离线动作回归</title>
<style>body{margin:24px;background:#08121b;color:#d5e9f0;font:16px system-ui}h1{font-size:22px;color:#ffcc7b}iframe{width:760px;height:425px;border:0;display:block}#result{font-size:20px;white-space:pre-line}</style>
<h1>离线回归 · 合成测试数据 · 未连接硬件</h1><p>静置 → 缺失200ms转动数据 → 恢复时已停止在30°。验证模型是否卡在旧角度。</p>
<iframe id="model" src="/assets/imu-model.html?regression=1"></iframe><p id="result">等待模型加载</p>
<script>
const frame=document.getElementById('model'),result=document.getElementById('result');let started=false;
function send(seq,us,angle=0){const r=angle*Math.PI/180;frame.contentWindow.postMessage({type:'imu-model-state',version:1,mode:'live',observedAtMs:Date.now(),status:{mcu_seq:seq,mcu_imu_us:us,received:seq,feedback_age_ms:1,imu_ok:true,app_instance_id:'offline-regression-only',acc:[0,-9.80665*Math.sin(r),-9.80665*Math.cos(r)],gyro:[0,0,0]}},location.origin);}
window.addEventListener('message',async e=>{if(started||e.origin!==location.origin||e.source!==frame.contentWindow||e.data?.type!=='imu-model-ready')return;started=true;
for(let i=1;i<=1000;i++)send(i,i*10000);
await new Promise(r=>setTimeout(r,250));send(1020,10200000,30);
await new Promise(r=>setTimeout(r,150));const actual=Number(frame.contentDocument.body.dataset.roll),pass=Math.abs(actual-30)<1;
result.textContent=(pass?'PASS':'FAIL')+'：目标30°，页面实际'+actual.toFixed(2)+'°\n这是离线回归，不是实机跟手验收。';result.dataset.pass=String(pass);
});
</script></html>
