<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小鸭子舵机编号</title><link rel="stylesheet" href="/assets/numbering-simple.css?v=4"></head>
<body class="numbering-page" data-phase="idle"><main>
<header><h1>舵机编号</h1><span id="read-state">尚未检查</span></header>
<section class="numbering-workspace" aria-label="自动编号进度">
<div class="robot-map">
<iframe id="numbering-model" src="/assets/imu-model.html?view=numbering" title="真实鸭子结构模型，可旋转查看舵机位置"></iframe>
<span class="model-caption" id="model-caption">结构模型</span><span class="model-hint">拖动旋转 · 滚轮缩放</span>
<div class="map-legend"><span><i class="confirmed"></i>已读到</span><span><i class="waiting"></i>下一颗</span></div>
</div>
<aside class="next-panel">
<div class="next-id"><span id="target-label">下一颗 ID</span><strong id="target-id">—</strong></div>
<p class="progress-label"><span id="count-label">已检查</span><b id="completed-count">— / 15</b></p>
<progress id="numbering-progress" max="15" value="0" aria-label="编号进度"></progress>
<p id="connection-hint">每次只接一颗出厂 ID 1。</p>
<div class="numbering-actions" aria-label="编号控制"><button id="continue" type="button">继续编号</button><button id="restart" type="button" class="quiet">重新检查</button><button id="stop" type="button" class="danger" disabled>停止</button></div>
<ol class="phase-track" aria-label="编号步骤"><li id="phase-connect">检查</li><li id="phase-numbering">编号</li><li id="phase-centering">读回</li><li id="phase-release">完成</li></ol>
</aside>
</section>
<p id="status" role="status" aria-live="polite">点击继续编号后开始检查。</p>
<details class="connection-help"><summary>接线与注意事项</summary><p>保留已编号舵机，每次只新增一颗 ID 1；变绿后再接下一颗。只修改新增舵机编号，不归中、不批量重置。进入编号会卸力，请先支撑好。</p></details>
</main><script>window.NUMBERING_TOKEN='__TOKEN__';</script><script src="/assets/numbering-restored.js?v=4"></script></body></html>
