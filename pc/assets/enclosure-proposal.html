<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XGO Duck 电路板保护壳方案</title>
<style>html,body{margin:0;height:100%;background:#091722;color:#d9edf4;font:14px system-ui}header{position:absolute;top:16px;left:18px;z-index:2;max-width:410px;padding:16px;background:#102631eb;border:1px solid #31505b;border-radius:12px}h1{font-size:20px;margin:0 0 7px}p{color:#96b4c0;margin:7px 0;font-size:12px}button{border:1px solid #3b697a;background:#153946;color:#d9f8ff;padding:8px 11px;margin:4px 4px 0 0;border-radius:6px;cursor:pointer}.badge{color:#f0b66d}canvas{display:block}#note{position:absolute;bottom:18px;left:18px;background:#102631dd;padding:10px 14px;border-radius:6px}#state{color:#62d6e4}</style>
<script type="importmap">{"imports":{"three":"/model-assets/vendor/build/three.module.js"}}</script>
<header><h1>电路板保护壳</h1><span class="badge">单件 R5 · 已确认装配合适</span><p>手触外边 1 mm 倒角 · 3/4 孔座 · 根部已填实</p><div><button id="assembled">装好</button><button id="switch">看开关</button><button id="opened">拿开看</button><button id="ports">看电源口</button><button id="shell">看四孔加强</button><button id="restore">恢复全部</button></div><p id="state">加载中</p></header>
<div id="note">拖动旋转 · 滚轮缩放<br>橙色是侧面拨片 · 四孔固定 · 电源座保持齐平</div>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from '/model-assets/vendor/examples/jsm/controls/OrbitControls.js';import {STLLoader} from '/model-assets/vendor/examples/jsm/loaders/STLLoader.js';
const data=await(await fetch('/model-assets/enclosure-proposal-r5/manifest.json')).json();
const scene=new THREE.Scene();scene.background=new THREE.Color('#091722');const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,3000);camera.up.set(0,0,1);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe0f5ff,0x304757,2.8));for(const [pos,power]of[[[-220,-260,400],3],[[160,100,300],2],[[-200,180,100],1.7]]){const l=new THREE.DirectionalLight(0xffffff,power);l.position.set(...pos);scene.add(l);}
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=false;const meshes=new Map(),loader=new STLLoader();let pending=false;
function draw(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;const hidden=[...meshes.values()].filter(m=>!m.visible).length;document.getElementById('state').textContent='已加载'+meshes.size+'个实际几何部件 · 隐藏'+hidden+'件 · 蓝色为新壳';renderer.render(scene,camera);});}controls.addEventListener('change',draw);
const boardInverse=new THREE.Matrix4().fromArray(data.board_to_world.flat()).transpose().invert();
for(const rec of data.records){const geo=await loader.loadAsync('/model-assets/enclosure-proposal-r5/'+rec.file);geo.computeVertexNormals();const mat=new THREE.MeshStandardMaterial({color:rec.color,roughness:.5,metalness:.12});
if(rec.id==='extension'){
  const pos=geo.attributes.position,colors=new Float32Array(pos.count*3),base=new THREE.Color(rec.color),metal=new THREE.Color('#48565d'),lever=new THREE.Color('#ffb14e'),c=new THREE.Vector3();
  for(let i=0;i<pos.count;i+=3){c.set((pos.getX(i)+pos.getX(i+1)+pos.getX(i+2))/3,(pos.getY(i)+pos.getY(i+1)+pos.getY(i+2))/3,(pos.getZ(i)+pos.getZ(i+1)+pos.getZ(i+2))/3).applyMatrix4(boardInverse);let color=base;
    if(c.x>=14.3267&&c.x<=27.2769&&c.y>=1.7249&&c.y<=16.5252&&c.z>=3.2013&&c.z<=8.7103){color=metal;if(c.x>=17.7516&&c.x<=21.5713&&c.y<=5.2252&&c.z<=7.1016)color=lever;}
    for(let k=0;k<3;k++)color.toArray(colors,(i+k)*3);
  }geo.setAttribute('color',new THREE.BufferAttribute(colors,3));mat.vertexColors=true;mat.color.set('#ffffff');
}
const mesh=new THREE.Mesh(geo,mat);mesh.name=rec.id;meshes.set(rec.id,mesh);scene.add(mesh);}
const grid=new THREE.GridHelper(300,15,0x355965,0x172f3c);grid.rotation.x=Math.PI/2;grid.position.z=-5;scene.add(grid);
function view(pos,target){camera.position.set(...pos);controls.target.set(...target);controls.update();draw();}
function reset(){for(const m of meshes.values())m.visible=true;meshes.get('cover').position.x=0;grid.visible=true;}
document.getElementById('assembled').onclick=()=>{reset();view([-370,-270,255],[0,0,140]);};
document.getElementById('switch').onclick=()=>{reset();for(const r of data.records)meshes.get(r.id).visible=r.kind!=='robot';grid.visible=false;view([-108,96,151],[-51,22,112]);};
document.getElementById('opened').onclick=()=>{reset();for(const r of data.records)meshes.get(r.id).visible=r.kind!=='robot';grid.visible=false;meshes.get('cover').position.x=-38;view([-235,-165,190],[-65,0,100]);};
document.getElementById('ports').onclick=()=>{reset();for(const r of data.records)meshes.get(r.id).visible=r.kind!=='robot';grid.visible=false;view([-190,-110,35],[-47,0,100]);};
document.getElementById('shell').onclick=()=>{reset();for(const r of data.records)meshes.get(r.id).visible=r.kind==='proposal';grid.visible=false;view([130,-40,135],[-52,0,99]);};
document.getElementById('restore').onclick=()=>{reset();draw();};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);draw();});
document.body.dataset.loaded='true';document.body.dataset.version=data.version;document.body.dataset.parts=String(meshes.size);document.getElementById('state').textContent='已加载'+meshes.size+'个部件 · 蓝色为单件罩壳';view([-370,-270,255],[0,0,140]);
</script></html>
